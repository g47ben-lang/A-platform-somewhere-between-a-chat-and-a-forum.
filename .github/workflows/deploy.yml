name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Supabase URL/key come from .env.production. An empty env var would override the file,
      # so optional repo Variables are exported only when set.
      - run: |
          [ -n "$SITE_NAME" ] && export VITE_SITE_NAME="$SITE_NAME"
          [ -n "$SB_URL" ] && export VITE_SUPABASE_URL="$SB_URL"
          [ -n "$SB_KEY" ] && export VITE_SUPABASE_ANON_KEY="$SB_KEY"
          npm run build
        env:
          SITE_NAME: ${{ vars.VITE_SITE_NAME }}
          SB_URL: ${{ vars.VITE_SUPABASE_URL }}
          SB_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
